<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Stay for a Minute — JESBALA</title><link href="style.css?v=20261112-aligned" rel="stylesheet"/><link href="sidebar-shared.css?v=20261112-aligned" rel="stylesheet"/><style>
body{background:#fff;color:#171717}.stay-main{padding:52px 55px 90px;min-width:0;max-width:1500px;width:100%;box-sizing:border-box}.stay-title{font-size:25px;font-weight:400;letter-spacing:.015em;margin:0 0 30px}.stay-section{margin:0 0 95px}.stay-section h2{font-size:17px;font-weight:400;margin:0 0 17px}.stay-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 20px;align-items:start}.stay-gallery.count-1{grid-template-columns:1fr}.stay-gallery.count-3 .stay-photo:first-child{grid-column:span 2}.stay-photo{display:flex;align-items:center;justify-content:center;min-width:0;width:100%;padding:0;border:0;background:none;cursor:zoom-in}.stay-photo img{display:block;max-width:100%;width:auto;height:auto;max-height:78svh;object-fit:contain}.stay-gallery.count-1 img{max-height:86svh}.stay-gallery.count-3 .stay-photo:first-child img{max-height:84svh}.stay-photo:hover img{opacity:.86}.stay-lightbox{position:fixed;inset:0;background:rgba(240,240,240,.78);backdrop-filter:blur(17px);-webkit-backdrop-filter:blur(17px);display:none;align-items:center;justify-content:center;z-index:9999;padding:45px;box-sizing:border-box;cursor:zoom-out}.stay-lightbox.open{display:flex}.stay-lightbox img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 12px 50px #0002}.lightbox-close{position:absolute;right:20px;top:15px;border:0;background:transparent;font-size:28px;cursor:pointer}@media(max-width:950px){.stay-main{padding:35px 24px 55px}.stay-gallery{gap:16px}}@media(max-width:650px){.stay-main{padding:30px 20px 50px}.stay-title{margin-bottom:24px}.stay-section{margin-bottom:65px}.stay-gallery{gap:12px}.stay-gallery:not(.count-1){grid-template-columns:repeat(2,minmax(0,1fr))}.stay-gallery img{max-height:60svh}.stay-gallery.count-3 .stay-photo:first-child img{max-height:70svh}.stay-lightbox{padding:25px}}

/* Match Whisky: close control sits just outside the expanded image. */
.stay-lightbox{padding:42px 28px;background:rgba(250,250,247,.67);-webkit-backdrop-filter:blur(19px) saturate(.82);backdrop-filter:blur(19px) saturate(.82);cursor:default}
.stay-lightbox-frame{position:relative;display:inline-flex;align-items:center;justify-content:center;max-width:calc(100vw - 100px);max-height:calc(100dvh - 84px);filter:drop-shadow(0 10px 25px rgba(30,30,30,.13))}
.stay-lightbox .stay-lightbox-image{display:block;max-width:calc(100vw - 100px);max-height:calc(100dvh - 84px);width:auto;height:auto;object-fit:contain;box-shadow:none;user-select:none}
.stay-lightbox .lightbox-close{position:absolute;right:-30px;top:12px;z-index:1;display:grid;place-items:center;width:22px;height:22px;padding:0;border:0;border-radius:0;background:transparent;color:#111;font:22px/1 Arial,sans-serif;cursor:pointer;box-shadow:none;transition:opacity .15s}
.stay-lightbox .lightbox-close:hover{opacity:.55}.stay-lightbox .lightbox-close:focus-visible{outline:1px solid #777;outline-offset:3px}
@media(max-width:650px){.stay-lightbox{padding:18px}.stay-lightbox-frame,.stay-lightbox .stay-lightbox-image{max-width:calc(100vw - 74px);max-height:calc(100dvh - 36px)}.stay-lightbox .lightbox-close{top:10px;right:-27px}}

el="Expand NYC, photograph 5" class="stay-photo" data-full="stay-images/nyc/One_World.png" type="button"><img alt="NYC, photograph 5" loading="lazy" src="stay-images/nyc/One_World.png"/></button><button aria-label="Expand NYC, photograph 6" class="stay-photo" data-full="stay-images/nyc/One.png" type="button"><img alt="NYC, photograph 6" loading="lazy" src="stay-images/nyc/One.png"/></button><button aria-label="Expand NYC, photograph 7" class="stay-photo" data-full="stay-images/nyc/Park_Building.png" type="button"><img alt="NYC, photograph 7" loading="lazy" src="stay-images/nyc/Park_Building.png"/></button><button aria-label="Expand NYC, photograph 8" class="stay-photo" data-full="stay-images/nyc/Short.png" type="button"><img alt="NYC, photograph 8" loading="lazy" src="stay-images/nyc/Short.png"/></button><button aria-label="Expand NYC, photograph 9" class="stay-photo" data-full="stay-images/nyc/Station.png" type="button"><img alt="NYC, photograph 9" loading="lazy" src="stay-images/nyc/Station.png"/></button></div></section></main></div><div aria-hidden="true" aria-label="Expanded photograph" aria-modal="true" class="stay-lightbox" id="stay-lightbox" role="dialog" tabindex="-1"><div class="stay-lightbox-frame"><button aria-label="Close" class="lightbox-close" type="button">×</button><img alt="" class="stay-lightbox-image"/></div></div><script>(()=>{const lightbox=document.getElementById('stay-lightbox'),full=lightbox.querySelector('.stay-lightbox-image'),close=lightbox.querySelector('.lightbox-close');let previousFocus=null;document.querySelectorAll('.stay-photo').forEach(b=>b.addEventListener('click',()=>{previousFocus=document.activeElement;full.src=b.dataset.full;full.alt=b.querySelector('img').alt;lightbox.classList.add('open');lightbox.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';close.focus()}));function closeArt(){if(!lightbox.classList.contains('open'))return;lightbox.classList.remove('open');lightbox.setAttribute('aria-hidden','true');full.removeAttribute('src');document.body.style.overflow='';if(previousFocus)previousFocus.focus()}close.addEventListener('click',closeArt);lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeArt()});document.addEventListener('keydown',e=>{if(!lightbox.classList.contains('open'))return;if(e.key==='Escape')closeArt();if(e.key==='Tab'){e.preventDefault();close.focus()}})})();</script></body></html>
