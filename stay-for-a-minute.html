const lightbox=document.getElementById('stay-lightbox'),full=lightbox.querySelector('img');let previousFocus=null;document.querySelectorAll('.stay-photo').forEach(b=>b.addEventListener('click',()=>{previousFocus=document.activeElement;full.src=b.dataset.full;full.alt=b.querySelector('img').alt;lightbox.classList.add('open');document.body.style.overflow='hidden';lightbox.focus()}));function closeArt(){if(!lightbox.classList.contains('open'))return;lightbox.classList.remove('open');full.removeAttribute('src');document.body.style.overflow='';if(previousFocus)previousFocus.focus()}lightbox.addEventListener('click',e=>{if(e.target===lightbox||e.target.classList.contains('lightbox-close'))closeArt()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeArt()});</script></body></html>
