body{background:#fff;color:#171717}.stay-main{padding:52px 55px 90px;min-width:0;max-width:1500px;width:100%;box-sizing:border-box}.stay-title{font-size:25px;font-weight:400;letter-spacing:.015em;margin:0 0 30px}.stay-section{margin:0 0 95px}.stay-section h2{font-size:17px;font-weight:400;margin:0 0 17px}.stay-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 20px;align-items:start}.stay-gallery.count-1{grid-template-columns:1fr}.stay-gallery.count-3 .stay-photo:first-child{grid-column:span 2}.stay-photo{display:flex;align-items:center;justify-content:center;min-width:0;width:100%;padding:0;border:0;background:none;cursor:zoom-in}.stay-photo img{display:block;max-width:100%;width:auto;height:auto;max-height:78svh;object-fit:contain}.stay-gallery.count-1 img{max-height:86svh}.stay-gallery.count-3 .stay-photo:first-child img{max-height:84svh}.stay-photo:hover img{opacity:.86}.stay-lightbox{position:fixed;inset:0;background:rgba(240,240,240,.78);backdrop-filter:blur(17px);-webkit-backdrop-filter:blur(17px);display:none;align-items:center;justify-content:center;z-index:9999;padding:45px;box-sizing:border-box;cursor:zoom-out}.stay-lightbox.open{display:flex}.stay-lightbox img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 12px 50px #0002}.lightbox-close{position:absolute;right:20px;top:15px;border:0;background:transparent;font-size:28px;cursor:pointer}@media(max-width:950px){.stay-main{padding:35px 24px 55px}.stay-gallery{gap:16px}}@media(max-width:650px){.stay-main{padding:30px 20px 50px}.stay-title{margin-bottom:24px}.stay-section{margin-bottom:65px}.stay-gallery{gap:12px}.stay-gallery:not(.count-1){grid-template-columns:repeat(2,minmax(0,1fr))}.stay-gallery img{max-height:60svh}.stay-gallery.count-3 .stay-photo:first-child img{max-height:70svh}.stay-lightbox{padding:25px}}

 5" class="stay-photo" data-full="stay-images/nyc/One_World.png" type="button"><img alt="NYC, photograph 5" loading="lazy" src="stay-images/nyc/One_World.png"/></button><button aria-label="Expand NYC, photograph 6" class="stay-photo" data-full="stay-images/nyc/One.png" type="button"><img alt="NYC, photograph 6" loading="lazy" src="stay-images/nyc/One.png"/></button><button aria-label="Expand NYC, photograph 7" class="stay-photo" data-full="stay-images/nyc/Park_Building.png" type="button"><img alt="NYC, photograph 7" loading="lazy" src="stay-images/nyc/Park_Building.png"/></button><button aria-label="Expand NYC, photograph 8" class="stay-photo" data-full="stay-images/nyc/Short.png" type="button"><img alt="NYC, photograph 8" loading="lazy" src="stay-images/nyc/Short.png"/></button><button aria-label="Expand NYC, photograph 9" class="stay-photo" data-full="stay-images/nyc/Station.png" type="button"><img alt="NYC, photograph 9" loading="lazy" src="stay-images/nyc/Station.png"/></button></div><h2>NYC</h2></section><p class="endnote">© 2026 JESBALA</p></main></div><div aria-hidden="true" aria-label="Expanded photograph" aria-modal="true" class="stay-lightbox" id="stay-lightbox" role="dialog" tabindex="-1"><div class="stay-lightbox-frame"><button aria-label="Close" class="lightbox-close" type="button">×</button><img alt="" class="stay-lightbox-image"/></div></div><script>(()=>{const lightbox=document.getElementById('stay-lightbox'),full=lightbox.querySelector('.stay-lightbox-image'),close=lightbox.querySelector('.lightbox-close');let previousFocus=null;document.querySelectorAll('.stay-photo').forEach(b=>b.addEventListener('click',()=>{previousFocus=document.activeElement;full.src=b.dataset.full;full.alt=b.querySelector('img').alt;lightbox.classList.add('open');lightbox.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';close.focus()}));function closeArt(){if(!lightbox.classList.contains('open'))return;lightbox.classList.remove('open');lightbox.setAttribute('aria-hidden','true');full.removeAttribute('src');document.body.style.overflow='';if(previousFocus)previousFocus.focus()}close.addEventListener('click',closeArt);lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeArt()});document.addEventListener('keydown',e=>{if(!lightbox.classList.contains('open'))return;if(e.key==='Escape')closeArt();if(e.key==='Tab'){e.preventDefault();close.focus()}})})();</script><script id="notes-ripple-script">
(()=>{
 const link=document.querySelector('.menu a[href="notes-app.html"]');
 if(!link)return;
 let leaving=false, pending=[];
 const symbols='01{}[]<>/\\*+~';
 const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
 function cancelPending(){pending.forEach(clearTimeout);pending=[]}
 link.addEventListener('click',e=>{
  if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||reduced())return;
  e.preventDefault();if(leaving)return;leaving=true;
  const destination=link.href;
  // Wrap characters in place, preserving layout rather than freezing a screenshot of the sidebar.
  const elements=[...document.querySelectorAll('.sidebar .brand,.sidebar .menu a,.sidebar .foot')];
  const pieces=[];
  elements.forEach(el=>{
   const original=el.innerHTML;
   const lines=el.classList.contains('foot') ? el.innerHTML.split(/<br\s*\/?\s*>/i).map(line=>{const temp=document.createElement('div');temp.innerHTML=line;return temp.textContent;}) : [el.textContent];
   el.setAttribute('data-ripple-original',original);
   el.textContent='';
   lines.forEach((line,lineIndex)=>{
    if(lineIndex)el.append(document.createElement('br'));
    for(const ch of line){
     const span=document.createElement('span');span.className='notes-ripple-char';span.textContent=ch;
     el.append(span);if(ch.trim())pieces.push({span,ch});
    }
   });
  });
  // A continuous top-to-bottom wave across the actual rendered character positions.
  const coords=pieces.map(p=>({ ...p, rect:p.span.getBoundingClientRect()}));
  const top=Math.min(...coords.map(p=>p.rect.top));
  const bottom=Math.max(...coords.map(p=>p.rect.bottom));
  document.body.classList.add('notes-ripple-exit');
  const total=1150;
  coords.forEach(({span,ch,rect},i)=>{
   const vertical=(rect.top-top)/Math.max(1,bottom-top);
   const horizontal=rect.left/Math.max(1,innerWidth);
   const delay=Math.round(90+vertical*560+horizontal*90);
   pending.push(setTimeout(()=>{
    // One soft code change as the wave reaches each letter, not repeated scrambling.
    span.textContent=symbols[(i*7+Math.floor(vertical*13))%symbols.length];
    span.classList.add('ripple-away');
   },delay));
  });
  pending.push(setTimeout(()=>location.assign(destination),total));
 });
 addEventListener('pageshow',()=>{
  cancelPending();document.body.classList.remove('notes-ripple-exit');
  document.querySelectorAll('[data-ripple-original]').forEach(el=>{
   el.innerHTML=el.getAttribute('data-ripple-original');el.removeAttribute('data-ripple-original');
  });
  leaving=false;
 });
})();
</script></body></html>
