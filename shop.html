
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="JESBALA shop — artwork and prints">
<title>Shop — JESBALA</title>
<style>
:root{--ink:#171717;--muted:#737373;--green:#198a42}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover{color:var(--green)}
.shop-shell{max-width:1550px;margin:0 auto;padding:28px 36px 65px}
.shop-header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:64px}
.brand{font-size:16px;letter-spacing:-.5px}
.shop-label{font-size:13px;color:var(--muted)}
.shop-intro{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:24px}
.shop-intro h1{font-size:16px;font-weight:400;margin:0}
.shop-intro p{font-size:12px;color:var(--muted);margin:0}
.shop-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:45px 22px}
.item{margin:0;min-width:0}
.art{background:#f4f4f4;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art img{display:block;width:100%;height:100%;object-fit:contain;transition:transform .35s ease}
.item:hover img{transform:scale(1.025)}
.item figcaption{padding-top:11px}
.item-title{font-size:13px;line-height:1.4}
.item-meta{font-size:12px;color:var(--muted);margin-top:5px}
.shop-footer{margin-top:85px;padding-top:22px;border-top:1px solid #eee;color:#999;font-size:11px;display:flex;justify-content:space-between;gap:16px}
@media(max-width:1050px){.shop-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){
.shop-shell{padding:20px 18px 40px}
.shop-header{margin-bottom:48px}
.shop-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 12px}
.shop-intro{align-items:flex-start;flex-direction:column;gap:8px}
}
@media(max-width:390px){.shop-grid{grid-template-columns:1fr}.art{aspect-ratio:4/5}}
</style>
</head>
<body>
<div class="shop-shell">
<header class="shop-header">
<a class="brand" href="index.html">JESBALA</a>
<span class="shop-label">SHOP</span>
</header>
<main>
<div class="shop-intro">
<h1>Works</h1>
<p>Prints and objects coming soon</p>
</div>
<div class="shop-grid">
<figure class="item">
<div class="art"><img src="taj-images/looking with flowers in arm.png" alt="Looking with Flowers" loading="lazy"></div>
<figcaption><div class="item-title">Looking with Flowers</div><div class="item-meta">Preview · Not yet for sale</div></figcaption>
</figure>
<figure class="item">
<div class="art"><img src="taj-images/happy tear.png" alt="Happy Tear" loading="lazy"></div>
<figcaption><div class="item-title">Happy Tear</div><div class="item-meta">Preview · Not yet for sale</div></figcaption>
</figure>
<figure class="item">
<div class="art"><img src="taj-images/hat design 1.png" alt="Hat Design 01" loading="lazy"></div>
<figcaption><div class="item-title">Hat Design 01</div><div class="item-meta">Preview · Not yet for sale</div></figcaption>
</figure>
<figure class="item">
<div class="art"><img src="taj-images/hat design 2.png" alt="Hat Design 02" loading="lazy"></div>
<figcaption><div class="item-title">Hat Design 02</div><div class="item-meta">Preview · Not yet for sale</div></figcaption>
</figure>
<figure class="item">
<div class="art"><img src="taj-images/hat design 3.png" alt="Hat Design 03" loading="lazy"></div>
<figcaption><div class="item-title">Hat Design 03</div><div class="item-meta">Preview · Not yet for sale</div></figcaption>
</figure>
<figure class="item">
<div class="art"><img src="taj-images/Te.png" alt="Te" loading="lazy"></div>
<figcaption><div class="item-title">Te</div><div class="item-meta">Preview · Not yet for sale</div></figcaption>
</figure>
<figure class="item">
<div class="art"><img src="taj-images/snake.png" alt="Snake" loading="lazy"></div>
<figcaption><div class="item-title">Snake</div><div class="item-meta">Preview · Not yet for sale</div></figcaption>
</figure>
<figure class="item">
<div class="art"><img src="taj-images/pope hat.png" alt="Pope Hat" loading="lazy"></div>
<figcaption><div class="item-title">Pope Hat</div><div class="item-meta">Preview · Not yet for sale</div></figcaption>
</figure>
</div>
</main>
<footer class="shop-footer">
<span>© 2026 JESBALA</span>
<a href="index.html">Back to portfolio</a>
</footer>
</div>
</body>
</html>
