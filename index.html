<style id="nav-unified">.menu .rhythms-nav{display:flex;flex-direction:column;align-items:flex-start;gap:13px}.menu .rhythms-nav a{display:block}.menu .rhythms-nav:hover a,.menu .rhythms-nav:focus-within a{color:#198a42}@media(max-width:650px){.menu .rhythms-nav{gap:11px}}</style><style id="notes-transition-style">
.notes-code-ghost{position:fixed;z-index:9999;margin:0;pointer-events:none;white-space:pre;line-height:1.2;transform-origin:left center;will-change:opacity,transform;}

body.notes-exiting .sun-home{transition:opacity .8s ease,filter .8s ease;opacity:0;filter:blur(8px)}

</style></head>

<canvas aria-hidden="true" id="sun-canvas"></canvas>
</button>
</main>
</div>
<script id="notes-transition-script">
(()=>{
 const link=document.querySelector('.menu a[href="notes-app.html"]');
 if(!link)return;
 let transitioning=false;
 const alphabet='01{}[]<>/\\#@%&*+=?!:;';
 link.addEventListener('click',event=>{
  if(event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey||link.target==='_blank')return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  event.preventDefault();
  if(transitioning)return;
  transitioning=true;
  const destination=link.href;
  const nodes=[...document.querySelectorAll('.sidebar .brand,.sidebar .menu a,.sidebar .foot')];
  const ghosts=nodes.map((el,index)=>{
   const rect=el.getBoundingClientRect();
   const style=getComputedStyle(el);
   const ghost=document.createElement('span');
   const original=el.textContent;
   ghost.className='notes-code-ghost';
   ghost.textContent=original;
   Object.assign(ghost.style,{
    left:rect.left+'px',top:rect.top+'px',font:style.font,
    fontFamily:style.fontFamily,fontSize:style.fontSize,fontWeight:style.fontWeight,
    letterSpacing:style.letterSpacing,color:style.color,
    lineHeight:style.lineHeight,width:rect.width+'px',height:rect.height+'px',
    whiteSpace:el.classList.contains('foot')?'pre-line':'nowrap'
   });
   document.body.appendChild(ghost);
   return {ghost,original,index};
  });
  document.body.classList.add('notes-exiting');
  const started=performance.now();
  function animate(now){
   const elapsed=now-started;
   ghosts.forEach(({ghost,original,index})=>{
    const start=index*27;
    const progress=Math.max(0,Math.min(1,(elapsed-start)/620));
    if(progress<=0)return;
    const scrambled=[...original].map(ch=>{
     if(/\s/.test(ch))return ch;
     if(Math.random()<progress*.85)return alphabet[Math.floor(Math.random()*alphabet.length)];
     return ch;
    }).join('');
    ghost.textContent=scrambled;
    ghost.style.opacity=String(Math.max(0,1-Math.pow(progress,1.65)));
    ghost.style.transform=`translate(${(Math.random()-.5)*progress*12}px,${-progress*8+(Math.random()-.5)*progress*7}px)`;
    ghost.style.filter=progress>.5&&Math.random()>.65?'blur(.7px)':'none';
   });
   if(elapsed<960){requestAnimationFrame(animate)}else{window.location.assign(destination)}
  }
  requestAnimationFrame(animate);
 });
 // Restore normal visibility if the browser returns to this page from its back-forward cache.
 window.addEventListener('pageshow',()=>{
  document.body.classList.remove('notes-exiting');
  document.querySelectorAll('.notes-code-ghost').forEach(el=>el.remove());
  transitioning=false;
 });
})();
</script></body>
