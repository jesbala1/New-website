<div class="lightbox" id="whisky-lightbox" role="dialog" aria-modal="true" aria-label="Expanded photograph" aria-hidden="true">
  <div class="lightbox-frame">
    <img class="lightbox-image" alt="">
    <button class="lightbox-close" type="button" aria-label="Close expanded photograph">&times;</button>
  </div>
</div>
<script>
(()=>{
 const photos=Array.from(document.querySelectorAll('.gallery .photo img'));
 const viewer=document.getElementById('whisky-lightbox');
 const large=viewer.querySelector('.lightbox-image');
 const close=viewer.querySelector('.lightbox-close');
 let previousFocus=null;
 function open(photo){previousFocus=document.activeElement;large.src=photo.getAttribute('src');large.alt=photo.alt;viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');document.body.classList.add('lightbox-active');close.focus();}
 function hide(){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');document.body.classList.remove('lightbox-active');large.removeAttribute('src');if(previousFocus&&previousFocus.focus)previousFocus.focus();}
 photos.forEach(photo=>{photo.setAttribute('tabindex','0');photo.setAttribute('role','button');photo.setAttribute('aria-label','Expand photograph');photo.addEventListener('click',()=>open(photo));photo.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(photo);}});});
 close.addEventListener('click',hide);
 viewer.addEventListener('click',e=>{if(e.target===viewer)hide();});
 document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')hide();if(e.key==='Tab'){e.preventDefault();close.focus();}});
})();
</script>
