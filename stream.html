<script>
(()=>{
'use strict';
const canvas=document.getElementById('stream-canvas');
const ctx=canvas.getContext('2d');
const source=document.getElementById('stream-source');
const holder=document.getElementById('artwork');
const reset=document.getElementById('stream-reset');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
const S=850, C=S/2, TAU=Math.PI*2;
let angle=0,last=0,raf=0,restoring=0,removed=0,coverage=new Set(),debris=[];
let pointerDown=false,prevPoint=null,ready=false;
const art=document.createElement('canvas'),ac=art.getContext('2d',{willReadFrequently:true});
const holes=document.createElement('canvas'),hc=holes.getContext('2d');
art.width=art.height=holes.width=holes.height=S;
function init(){
 if(ready||!source.complete||!source.naturalWidth)return;
 try{
 ac.clearRect(0,0,S,S);ac.drawImage(source,0,0,S,S);
 hc.clearRect(0,0,S,S);ready=true;holder.classList.add('ready');
 if(!reduced.matches)raf=requestAnimationFrame(frame);else draw();
 }catch(err){holder.classList.add('fallback');}
}
function coords(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*S/r.width,y:(e.clientY-r.top)*S/r.height};}
function local(x,y){const dx=x-C,dy=y-C,co=Math.cos(angle),si=Math.sin(angle);return{x:C+dx*co+dy*si,y:C-dx*si+dy*co};}
function isArtwork(x,y){if(x<1||y<1||x>=S-1||y>=S-1)return false;const d=ac.getImageData(Math.round(x),Math.round(y),1,1).data;return d[3]>75&&!(d[0]>245&&d[1]>245&&d[2]>245);}
function strike(x,y,force=1){
 if(!ready||reduced.matches||restoring)return;
 const p=local(x,y);if(!isArtwork(p.x,p.y))return;
 const radius=19+force*9;
 // The erasure mask is in the original image's coordinates, so holes rotate with the art.
 hc.fillStyle='#000';hc.beginPath();hc.arc(p.x,p.y,radius,0,TAU);hc.fill();
 removed++;const sector=Math.floor((Math.atan2(p.y-C,p.x-C)+Math.PI)/TAU*18);coverage.add(sector);
 const count=Math.min(75,Math.round(28+force*22));
 for(let i=0;i<count;i++){
  const a=Math.random()*TAU,r=Math.sqrt(Math.random())*radius;
  const sx=p.x+Math.cos(a)*r,sy=p.y+Math.sin(a)*r;
  if(sx<0||sy<0||sx>=S||sy>=S)continue;
  const color=ac.getImageData(sx|0,sy|0,1,1).data;
  if(color[3]<75||color[0]>245&&color[1]>245&&color[2]>245)continue;
  const dx=sx-C,dy=sy-C,co=Math.cos(angle),si=Math.sin(angle);
  const wx=C+dx*co-dy*si,wy=C+dx*si+dy*co;
  const outward=Math.atan2(wy-C,wx-C)+(.5-Math.random())*1.8;
  const speed=2.8+Math.random()*7*force;
  debris.push({x:wx,y:wy,vx:Math.cos(outward)*speed,vy:Math.sin(outward)*speed,life:1,color:`rgb(${color[0]},${color[1]},${color[2]})`,size:1.1+Math.random()*2.4});
 }
 if(debris.length>1700)debris.splice(0,debris.length-1700);
 // Completing a sweep of the image reassembles all the missing parts.
 if(coverage.size>=14&&removed>=22)restore();
}
function restore(){if(restoring)return;restoring=1;}
function resetArtwork(){restore();}
function draw(){
 ctx.clearRect(0,0,S,S);ctx.fillStyle='#fff';ctx.fillRect(0,0,S,S);
 ctx.save();ctx.translate(C,C);ctx.rotate(angle);ctx.translate(-C,-C);
 // Rebuild from the original artwork and subtract permanent damage.
 const composite=document.createElement('canvas');composite.width=composite.height=S;
 const cc=composite.getContext('2d');cc.drawImage(art,0,0);
 cc.globalCompositeOperation='destination-out';cc.drawImage(holes,0,0);
 ctx.drawImage(composite,0,0);
 if(restoring){ctx.globalAlpha=restoring;ctx.drawImage(art,0,0);ctx.globalAlpha=1;}
 ctx.restore();
 for(const p of debris){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);}
 ctx.globalAlpha=1;
}
// Reuse one composite canvas rather than allocating it on every frame.
const composite=document.createElement('canvas');composite.width=composite.height=S;
const cc=composite.getContext('2d');
function render(){
 ctx.fillStyle='#fff';ctx.fillRect(0,0,S,S);
 cc.globalCompositeOperation='source-over';cc.clearRect(0,0,S,S);cc.drawImage(art,0,0);
 cc.globalCompositeOperation='destination-out';cc.drawImage(holes,0,0);
 cc.globalCompositeOperation='source-over';
 ctx.save();ctx.translate(C,C);ctx.rotate(angle);ctx.translate(-C,-C);
 ctx.drawImage(composite,0,0);
 if(restoring){ctx.globalAlpha=Math.min(1,restoring);ctx.drawImage(art,0,0);ctx.globalAlpha=1;}
 ctx.restore();
 for(const p of debris){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;
}
function frame(t){
 const dt=Math.min(2,(t-last||16.7)/16.7);last=t;
 angle=(angle+0.0028*dt)%TAU;
 if(restoring){restoring+=.025*dt;if(restoring>=1){restoring=0;removed=0;coverage.clear();hc.clearRect(0,0,S,S);}}
 debris=debris.filter(p=>p.life>0);for(const p of debris){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy=p.vy*.985+.05*dt;p.life-=.015*dt;}
 render();raf=requestAnimationFrame(frame);
}
function move(e){if(!ready||reduced.matches)return;const p=coords(e);if(prevPoint){const dx=p.x-prevPoint.x,dy=p.y-prevPoint.y;const d=Math.hypot(dx,dy);if(d>7){const n=Math.min(18,Math.ceil(d/13));for(let i=1;i<=n;i++){const f=i/n;strike(prevPoint.x+dx*f,prevPoint.y+dy*f,.55)}}}prevPoint=p;}
canvas.addEventListener('pointerenter',e=>{prevPoint=coords(e)});
canvas.addEventListener('pointermove',move);
canvas.addEventListener('pointerleave',()=>{prevPoint=null;pointerDown=false});
canvas.addEventListener('pointerdown',e=>{pointerDown=true;const p=coords(e);prevPoint=p;strike(p.x,p.y,1.4);if(e.pointerType!=='mouse')canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',()=>{pointerDown=false;prevPoint=null});
canvas.addEventListener('pointercancel',()=>{pointerDown=false;prevPoint=null});
holder.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(reduced.matches)return;for(let i=0;i<5;i++){const a=Math.random()*TAU;strike(C+Math.cos(a)*180,C+Math.sin(a)*180,1.5)}}});
if(reset)reset.addEventListener('click',resetArtwork);
reduced.addEventListener('change',()=>{if(reduced.matches){cancelAnimationFrame(raf);raf=0;angle=0;hc.clearRect(0,0,S,S);debris=[];coverage.clear();removed=0;restoring=0;render()}else if(ready&&!raf){last=0;raf=requestAnimationFrame(frame)}});
source.addEventListener('load',init);source.addEventListener('error',()=>holder.classList.add('fallback'));
