<script id="notes-ripple-script">
(()=>{
 const link=document.querySelector('.menu a[href="notes-app.html"]');
 if(!link)return;
 let leaving=false, pending=[];
 const symbols='01{}[]<>/\\*+~';
 const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
 function cancelPending(){pending.forEach(clearTimeout);pending=[]}
 link.addEventListener('click',e=>{
  if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||reduced())return;
  e.preventDefault();if(leaving)return;leaving=true;
  const destination=link.href;
  // Wrap characters in place, preserving layout rather than freezing a screenshot of the sidebar.
  const elements=[...document.querySelectorAll('.sidebar .brand,.sidebar .menu a,.sidebar .foot')];
  const pieces=[];
  elements.forEach(el=>{
   const original=el.innerHTML;
   const lines=el.classList.contains('foot') ? el.innerHTML.split(/<br\s*\/?\s*>/i).map(line=>{const temp=document.createElement('div');temp.innerHTML=line;return temp.textContent;}) : [el.textContent];
   el.setAttribute('data-ripple-original',original);
   el.textContent='';
   lines.forEach((line,lineIndex)=>{
    if(lineIndex)el.append(document.createElement('br'));
    for(const ch of line){
     const span=document.createElement('span');span.className='notes-ripple-char';span.textContent=ch;
     el.append(span);if(ch.trim())pieces.push({span,ch});
    }
   });
  });
  // A continuous top-to-bottom wave across the actual rendered character positions.
  const coords=pieces.map(p=>({ ...p, rect:p.span.getBoundingClientRect()}));
  const top=Math.min(...coords.map(p=>p.rect.top));
  const bottom=Math.max(...coords.map(p=>p.rect.bottom));
  document.body.classList.add('notes-ripple-exit');
  const total=1150;
  coords.forEach(({span,ch,rect},i)=>{
   const vertical=(rect.top-top)/Math.max(1,bottom-top);
   const horizontal=rect.left/Math.max(1,innerWidth);
   const delay=Math.round(90+vertical*560+horizontal*90);
   pending.push(setTimeout(()=>{
    // One soft code change as the wave reaches each letter, not repeated scrambling.
    span.textContent=symbols[(i*7+Math.floor(vertical*13))%symbols.length];
    span.classList.add('ripple-away');
   },delay));
  });
  pending.push(setTimeout(()=>location.assign(destination),total));
 });
 addEventListener('pageshow',()=>{
  cancelPending();document.body.classList.remove('notes-ripple-exit');
  document.querySelectorAll('[data-ripple-original]').forEach(el=>{
   el.innerHTML=el.getAttribute('data-ripple-original');el.removeAttribute('data-ripple-original');
  });
  leaving=false;
 });
})();
</script><div aria-hidden="true" aria-label="Expanded artwork" aria-modal="true" class="taj-lightbox" id="taj-lightbox" role="dialog"><div class="taj-lightbox-frame"><button aria-label="Close" class="taj-lightbox-close" type="button">×</button><img alt="" class="taj-lightbox-image"/></div></div><script>(()=>{const lb=document.getElementById('taj-lightbox'),full=lb.querySelector('img'),close=lb.querySelector('button');let prev;document.querySelectorAll('.taj-work img').forEach(img=>img.addEventListener('click',()=>{prev=document.activeElement;full.src=img.src;full.alt=img.alt;lb.classList.add('open');lb.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';close.focus()}));function hide(){lb.classList.remove('open');lb.setAttribute('aria-hidden','true');full.removeAttribute('src');document.body.style.overflow='';prev?.focus()}close.addEventListener('click',hide);lb.addEventListener('click',e=>{if(e.target===lb)hide()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&lb.classList.contains('open'))hide()})})();</script></body>
